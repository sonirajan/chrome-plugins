<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background-color: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Background ── */
    #bg {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      /* subtle darkening so white text pops */
      filter: brightness(0.82);
      opacity: 1;
    }

    /* ── Clock container ── */
    #clock-wrap {
      position: relative;
      z-index: 10;
      text-align: center;
      color: #ffffff;
      /* iOS-style soft text shadow for legibility over any photo */
      text-shadow:
        0 1px 8px rgba(0, 0, 0, 0.6),
        0 2px 32px rgba(0, 0, 0, 0.4);
      user-select: none;
    }

    #time {
      font-size: clamp(80px, 12vw, 140px);
      font-weight: 200;
      letter-spacing: -0.02em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 0.1em;
    }

    .ampm {
      font-size: 0.2em;
      font-weight: 400;
      padding-bottom: 0.3em;
      letter-spacing: 0.05em;
    }

    #date {
      margin-top: 0.3em;
      font-size: clamp(22px, 3vw, 38px);
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    #today-text {
      margin-top: 0.9em;
      font-size: clamp(20px, 2vw, 32px);
      font-weight: 500;
      letter-spacing: 0.02em;
      opacity: 1;
    }

    #bg, #clock-wrap {
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    #bg.ready, #clock-wrap.ready {
      opacity: 1;
    }

    body {
      background-color: #111111;  /* near black — blends with any photo */
    }

    /* ── Task section ── */
    #task-wrap {
      margin-top: 1em;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 2em;
    }

    #task-placeholder {
      font-size: clamp(18px, 2vw, 28px);
      font-weight: 400;
      opacity: 0.55;
      cursor: pointer;
      transition: opacity 0.2s;
      letter-spacing: 0.02em;
    }
    #task-placeholder:hover { opacity: 0.85; }

    #task-input-wrap {
      display: none;
      align-items: center;
      gap: 0.5em;
    }

    #task-input {
      background: transparent;
      border: none;
      border-bottom: 1.5px solid rgba(255,255,255,0.6);
      color: #ffffff;
      font-family: inherit;
      font-size: clamp(18px, 2vw, 28px);
      font-weight: 500;
      letter-spacing: 0.02em;
      text-align: center;
      width: clamp(200px, 30vw, 480px);
      padding: 0.2em 0;
      outline: none;
      text-shadow: none;
      transition: border-color 0.2s;
    }
    #task-input::placeholder { color: rgba(255,255,255,0.4); font-weight: 400; }
    #task-input:focus { border-bottom-color: rgba(255,255,255,0.9); }

    #task-display-wrap {
      display: none;
      align-items: center;
      gap: 0.6em;
    }

    #task-display-text {
      font-size: clamp(18px, 2vw, 28px);
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.3);
      padding-bottom: 0.1em;
      transition: border-color 0.2s;
    }
    #task-display-text:hover { border-bottom-color: rgba(255,255,255,0.8); }

    .task-btn {
      font-size: 1.1em;
      opacity: 0.5;
      cursor: pointer;
      background: none;
      border: none;
      color: #ffffff;
      text-shadow: none;
      padding: 0;
      line-height: 1;
      transition: opacity 0.2s;
    }
    .task-btn:hover { opacity: 1; }
  </style>
</head>
<body>

  <div id="bg"></div>

  <div id="clock-wrap">
    <div id="time">00:00</div>
    <div id="date">Sunday, January 1</div>
    <div id="today-text"></div>
    <div id="task-wrap">
      <div id="task-placeholder">+ What's your #1 priority today?</div>

      <div id="task-input-wrap">
        <input id="task-input" type="text" maxlength="80" placeholder="Type your task and press Enter" />
        <button class="task-btn" id="task-cancel">×</button>
      </div>

      <div id="task-display-wrap">
        <span id="task-display-text"></span>
        <button class="task-btn" id="task-clear">×</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="quotes.js"></script>
  <script src="clock.js"></script>

</body>
</html>
